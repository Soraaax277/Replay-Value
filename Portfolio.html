          cardVideo: '<video src="Images/Portfolio/Artworks/VFX/EDU_LightningVFXGraph.mp4" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover; pointer-events:none;"></video>',
          videoHTML: '<video src="Images/Portfolio/Artworks/VFX/EDU_LightningVFXGraph.mp4" controls autoplay loop playsinline style="width:100%; height:100%; object-fit:contain; background:#000;"></video>'
        }
      }
    };

    const websitesData = {
      nestly: {
        title: "Nestly App", desc: "A sleek mobile application designed to simplify home organization and property management. Features a clean, intuitive interface with real-time notifications and community tracking.",
        features: ["Intuitive mobile-first design", "Secure user authentication & data storage", "Real-time updates and notifications", "Clean, minimalist aesthetic"],
        year: "2025", tools: "Figma, React Native", roles: "UI/UX, Frontend Developer", platform: "iOS, Android",
        images: ["Images/Portfolio/Websites/Nestly%20App.mp4"],
        cardVideo: '<video src="Images/Portfolio/Websites/Nestly%20App.mp4" autoplay loop muted playsinline class="site-media" style="width:100%;height:100%;object-fit:cover;"></video>',
        videoHTML: '<video src="Images/Portfolio/Websites/Nestly%20App.mp4" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>'
      },
      tequila: {
        title: "Tequila Sunrise", desc: "A vibrant and energetic website capturing the essence of the Tequila Sunrise spirit. High-impact visuals meeting professional development standards for a compelling brand story.",
        features: ["High-impact visual design", "Responsive mobile-friendly layout", "Smooth scroll animations", "Optimized media delivery"],
        year: "2024", tools: "HTML, CSS, JS", roles: "Lead Developer", platform: "Web",
        images: ["Images/Portfolio/Websites/Website_TequilaSunrise.mp4"],
        cardVideo: '<video src="Images/Portfolio/Websites/Website_TequilaSunrise.mp4" autoplay loop muted playsinline class="site-media" style="width:100%;height:100%;object-fit:cover;"></video>',
        videoHTML: '<video src="Images/Portfolio/Websites/Website_TequilaSunrise.mp4" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>'
      },
      final: {
        title: "Pacific Crossing", desc: "Discover the unique culinary experience of this fusion restaurant platform. Bringing together the best of Japanese, Chinese, and Filipino cuisines.",
        features: ["Modern fusion restaurant frontend", "Appetizing visual hierarchy", "Engaging promotional banners"],
        year: "2024", tools: "HTML, CSS, JS", roles: "Lead Programmer", platform: "Desktop, Mobile",
        images: ["https://img.youtube.com/vi/ndlmMfa2f6Y/maxresdefault.jpg"],
        cardVideo: '<iframe src="https://www.youtube.com/embed/ndlmMfa2f6Y?autoplay=1&mute=1&loop=1&playlist=ndlmMfa2f6Y&controls=0&disablekb=1&fs=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media" tabindex="-1" class="site-media" style="width:100%;height:100%;border:none;"></iframe>',
        videoHTML: '<iframe src="https://www.youtube.com/embed/ndlmMfa2f6Y?autoplay=1" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>'
      },
      royal: {
        title: "Royal Oak", desc: "A premium hotel website that caters to a diverse clientele, offering luxurious accommodations alongside affordable room tiers.",
        features: ["Elegant, nature-inspired visual design", "Flexible booking options", "Responsive multimedia galleries"],
        year: "2024", tools: "HTML, CSS, JS", roles: "Programmer", platform: "Desktop, Mobile",
        images: ["https://img.youtube.com/vi/qE3psGruiyg/maxresdefault.jpg"],
        cardVideo: '<iframe src="https://www.youtube.com/embed/qE3psGruiyg?autoplay=1&mute=1&loop=1&playlist=qE3psGruiyg&controls=0&disablekb=1&fs=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media" tabindex="-1" class="site-media" style="width:100%;height:100%;border:none;"></iframe>',
        videoHTML: '<iframe src="https://www.youtube.com/embed/qE3psGruiyg?autoplay=1" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>'
      }
    };

    /* ─── Populate Grids ────────────────────────────── */
    const photoGrid = document.getElementById('grid-photography');
    const artGrid   = document.getElementById('grid-art');
    const audioGrid = document.getElementById('grid-audio');
    const gamesGrid = document.getElementById('grid-games');
    const sitesGrid = document.getElementById('grid-websites');
    const vfxGrid   = document.getElementById('grid-vfx');

    // 1. Populate Games
    Object.keys(gameData).forEach(id => {
      const data = gameData[id];
      const card = document.createElement('div');
      card.className = 'hub-card';
      card.setAttribute('data-game', id);
      card.innerHTML = `
        <div class="hub-video-wrap">
          ${data.cardVideo}
          <div class="hub-overlay"><span class="hub-more-info">↗ MORE INFO</span></div>
        </div>
        <h3 class="hub-title">${data.title}</h3>
      `;
      gamesGrid.appendChild(card);
    });

    // 2. Populate Photography (Nested)
    Object.keys(artworksData.photography).forEach((categoryName, index) => {
      const subCatWrap = document.createElement('div');
      subCatWrap.className = 'sub-category-wrap';
      const subCatId = 'hub-photo-cat-' + index;
      const firstImg = artworksData.photography[categoryName][0];
      
      subCatWrap.innerHTML = `
        <button class="cat-banner-btn sub-cat-banner-btn" aria-expanded="false" data-target="${subCatId}">
          <div class="cat-banner-bg" style="background-image: url('Images/Portfolio/Artworks/Photography/${categoryName}/${firstImg}');"></div>
          <div class="cat-banner-overlay"></div>
          <h3 class="cat-banner-title sub-cat-title-text">${categoryName}</h3>
          <span class="sub-cat-icon">+</span>
        </button>
        <div class="sub-cat-content" id="${subCatId}">
          <div class="sub-cat-grid"></div>
        </div>
      `;
      
      const subGrid = subCatWrap.querySelector('.sub-cat-grid');
      artworksData.photography[categoryName].forEach(file => {
        const item = document.createElement('div');
        item.className = 'art-item';
        item.innerHTML = `<img src="Images/Portfolio/Artworks/Photography/${categoryName}/${file}" class="zoomable-img" />`;
        subGrid.appendChild(item);
      });
      photoGrid.appendChild(subCatWrap);
    });

    // 3. Populate Art
    artworksData.art.forEach(file => {
      const item = document.createElement('div');
      item.className = 'art-item';
      item.innerHTML = `<img src="Images/Portfolio/Artworks/Art/${file}" class="zoomable-img" />`;
      artGrid.appendChild(item);
    });

    // 4. Populate Audio
    artworksData.audio.forEach(audioObj => {
      const item = document.createElement('div');
      item.className = 'audio-item';
      item.innerHTML = `
        <div class="audio-thumb-wrap">
          <img src="Images/Portfolio/Artworks/Audio/${audioObj.thumb}" alt="${audioObj.title}" loading="lazy" />
          <div class="audio-overlay">
            <span class="audio-icon">▶ PLAYING</span>
          </div>
        </div>
        <h3 class="audio-title">${audioObj.title}</h3>
        <div class="volume-controls">
          <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <audio class="hidden-audio" src="Images/Portfolio/Artworks/Audio/${audioObj.file}" preload="none"></audio>
      `;
      const audio = item.querySelector('audio');
      const volumeSlider = item.querySelector('.volume-slider');
      
      volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
      });

      // Prevent card click/hover reset when interacting with slider
      volumeSlider.addEventListener('click', (e) => e.stopPropagation());
      volumeSlider.addEventListener('mouseenter', (e) => e.stopPropagation());

      item.onmouseenter = () => { 
        audio.play().catch(e => {}); 
        item.classList.add('playing');
      };
      item.onmouseleave = () => { 
        audio.pause(); 
        audio.currentTime = 0; 
        item.classList.remove('playing');
      };
      audioGrid.appendChild(item);
    });

    // 5. Populate Websites
    Object.keys(websitesData).forEach(id => {
      const data = websitesData[id];
      const card = document.createElement('article');
      card.className = 'website-card';
      card.setAttribute('data-website', id);
      card.innerHTML = `
        <div class="site-media-wrap" style="height: 100%; width: 100%;">
           ${data.cardVideo}
        </div>
        <div class="site-overlay"><h3>${data.title}</h3><p>${data.platform}</p></div>
      `;
      sitesGrid.appendChild(card);
    });

    // 6. Populate VFX
    Object.keys(artworksData.vfx).forEach(id => {
      const data = artworksData.vfx[id];
      const card = document.createElement('div');
      card.className = 'hub-card';
      card.setAttribute('data-vfx', id);
      card.innerHTML = `
        <div class="hub-video-wrap">
          ${data.cardVideo}
          <div class="hub-overlay"><span class="hub-more-info">↗ VIEW DETAILS</span></div>
        </div>
        <h3 class="hub-title">${data.title}</h3>
      `;
      vfxGrid.appendChild(card);
    });

    /* ─── Global Accordion Logic ─────────────────────── */
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-banner-btn');
      if (!btn) return;
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !isExpanded);
      const icon = btn.querySelector('.sub-cat-icon');
      if (icon) icon.textContent = isExpanded ? '+' : '-';
      const target = document.getElementById(btn.getAttribute('data-target'));
      if (target) {
        if (!isExpanded) {
          target.style.maxHeight = target.scrollHeight + "px";
          setTimeout(() => { target.style.maxHeight = "none"; }, 400);
          const parent = btn.closest('.cat-content');
          if (parent) parent.style.maxHeight = 'none';
        } else {
          target.style.maxHeight = target.scrollHeight + "px";
          target.offsetHeight;
          target.style.maxHeight = "0";
        }
      }
    });

    /* ─── Modals Logic ───────────────────────────────── */
    const showGameModal = (id) => {
      const data = gameData[id];
      const modal = document.getElementById('game-modal');
      const videoWrap = document.getElementById('modal-game-video-wrap');
      const heroImg = document.getElementById('modal-game-hero-img');
      
      videoWrap.innerHTML = data.videoHTML;
      const v = videoWrap.querySelector('video');
      if (v) v.volume = 0.3;

      if (data.images && data.images[0]) {
        heroImg.src = data.images[0];
        heroImg.style.display = data.videoHTML ? 'none' : 'block';
      } else {
        heroImg.style.display = 'none';
      }

      document.getElementById('modal-game-title').textContent = data.title;
      document.getElementById('modal-game-desc').textContent = data.desc;
      document.getElementById('modal-game-year').textContent = data.year;
      document.getElementById('modal-game-tools').textContent = data.tools;
      
      // Update info right based on item type
      const rolesBlock = document.getElementById('modal-game-roles').parentElement;
      const platformBlock = document.getElementById('modal-game-platform').parentElement;

      if (id.startsWith('vfx-')) {
        rolesBlock.style.display = 'none';
        platformBlock.style.display = 'none';
      } else {
        rolesBlock.style.display = 'block';
        platformBlock.style.display = 'block';
        document.getElementById('modal-game-roles').textContent = data.roles;
        document.getElementById('modal-game-platform').textContent = data.platform;
      }
      
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    };

    const showVfxModal = (id) => {
      const vfxInfo = artworksData.vfx[id];
      showGameModal(id); // Reuse game modal but custom logic inside handles hiding blocks
    };

    const showWebsiteModal = (id) => {
      const data = websitesData[id];
      const modal = document.getElementById('website-modal');
      const videoWrap = document.getElementById('modal-site-video-wrap');
      const heroImg = document.getElementById('modal-site-hero-img');
      
      videoWrap.innerHTML = data.videoHTML;
      const v = videoWrap.querySelector('video');
      if (v) v.volume = 0.3;
      heroImg.src = data.images[0];
      
      document.getElementById('modal-site-title').textContent = data.title;
      document.getElementById('modal-site-desc').textContent = data.desc;
      document.getElementById('modal-site-year').textContent = data.year;
      document.getElementById('modal-site-tools').textContent = data.tools;
      document.getElementById('modal-site-roles').textContent = data.roles;
      document.getElementById('modal-site-platform').textContent = data.platform;
      
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    };

    document.addEventListener('click', e => {
      const gameCard = e.target.closest('.hub-card');
      const siteCard = e.target.closest('.website-card');
      if (gameCard) {
        const id = gameCard.getAttribute('data-game') || gameCard.getAttribute('data-vfx');
        if (gameCard.hasAttribute('data-vfx')) {
          const vfxData = artworksData.vfx[id];
          // We need gameData but for VFX.
          // I'll merge it into a temporary object or just use artworksData.vfx.
          // Let's modify showGameModal to accept the data directly or find it.
          const modalData = gameData[id] || artworksData.vfx[id];
          
          const modal = document.getElementById('game-modal');
          const videoWrap = document.getElementById('modal-game-video-wrap');
          const heroImg = document.getElementById('modal-game-hero-img');
          
          videoWrap.innerHTML = modalData.videoHTML;
          const v = videoWrap.querySelector('video');
          if (v) v.volume = 0.3;
          heroImg.style.display = 'none';
          
          document.getElementById('modal-game-title').textContent = modalData.title;
          document.getElementById('modal-game-desc').textContent = modalData.desc;
          document.getElementById('modal-game-year').textContent = modalData.year;
          document.getElementById('modal-game-tools').textContent = modalData.tools;
          
          document.getElementById('modal-game-roles').parentElement.style.display = 'none';
          document.getElementById('modal-game-platform').parentElement.style.display = 'none';
          
          modal.classList.add('show');
          document.body.style.overflow = 'hidden';
        } else {
          showGameModal(id);
        }
      }
      if (siteCard) showWebsiteModal(siteCard.getAttribute('data-website'));
    });

    document.querySelectorAll('.modal-close').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.game-modal').forEach(m => m.classList.remove('show'));
        document.body.style.overflow = '';
        setTimeout(() => { 
          document.getElementById('modal-game-video-wrap').innerHTML = '';
          document.getElementById('modal-site-video-wrap').innerHTML = '';
        }, 300);
      };
    });

    /* ─── Lightbox ───────────────────────────────────── */
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    document.addEventListener('click', e => {
      if (e.target.classList.contains('zoomable-img')) {
        lightboxImg.src = e.target.src;
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
    });
    document.getElementById('lightbox-close').onclick = () => {
      lightbox.classList.remove('show');
      document.body.style.overflow = '';
    };


  </script>
