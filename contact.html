<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replay Value</title>
  <link rel="icon" href="Images/Logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet" />
  <script src="components.js"></script>
  <script src="effects.js" defer></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="contact-page">
  <canvas id="glcanvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>
  <div id="particles-container"></div>

  <!-- ─── Navbar ─────────────────────────────────────── -->
  <site-navbar></site-navbar>

  <!-- ─── Contact Form Section ───────────────────────── -->
  <main class="contact-wrap">
    <div class="contact-box">
      <h2>GET IN TOUCH</h2>
      
      <form id="contact-form" action="https://formspree.io/f/mreydlgg" method="POST" class="contact-form">
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" required rows="5"></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>

    <div class="contact-footer-text">
      <p>You can connect with me using the icons below,<br>or send me an email at <strong>marcaceedu@gmail.com</strong></p>
      <div class="contact-socials">
        <a href="https://www.linkedin.com/in/marc-ace-rycell-edu-9aaa06236/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/Soraaax277" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://soraaax277.itch.io" target="_blank" rel="noopener" aria-label="itch.io"><i class="fab fa-itch-io"></i></a>
        <a href="https://www.instagram.com/soraaa.arts/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </main>

  <!-- ─── Footer ─────────────────────────────────────── -->
  <site-footer></site-footer>

  <script>

    
    /* ─── Navbar Scroll Effect ──────────────────────── */
    const navbar = document.getElementById('navbar');
    let scrollHideTimer = null;
    window.addEventListener('scroll', () => {
      if(navbar) {
        navbar.classList.toggle('scrolled', window.scrollY > 10);
        if (window.scrollY > 50) navbar.classList.add('hidden');
        else navbar.classList.remove('hidden');

        clearTimeout(scrollHideTimer);
        scrollHideTimer = setTimeout(() => {
          navbar.classList.remove('hidden');
        }, 1500);
      }
    }, { passive: true });
    /* ─── Formspree AJAX Submission ─────────────────── */
    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const data = new FormData(contactForm);
        const btn = contactForm.querySelector('button');
        const ogText = btn.innerText;
        btn.innerText = 'Sending...';
        btn.disabled = true;

        try {
          const response = await fetch(contactForm.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
          });
          if (response.ok) {
            contactForm.innerHTML = '<h3 style="color:#39a845; text-align:center; margin-bottom: 10px; font-family: Oswald, \'Bebas Neue\', sans-serif; font-size: 2rem; letter-spacing: 0.1em;">MESSAGE SENT!</h3><p style="text-align:center; color:#ccc;">Thanks for reaching out. I will get back to you shortly.</p>';
          } else {
            alert('Oops! There was a problem submitting your form.');
            btn.innerText = ogText;
            btn.disabled = false;
          }
        } catch (error) {
          alert('Oops! There was a problem submitting your form.');
          btn.innerText = ogText;
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
